[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ia_agents"
version = "0.1.0"
description = "Capstone project for the ITBA's AI agent development course"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
client = "ia_agents.cli:main"
ingest = "ia_agents.ingest_cli:main"
retrieve = "ia_agents.retrieve_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
